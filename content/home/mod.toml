# dream-scene as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `scene-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "e20f98cb-26dd-4bfa-8c4e-e9f7e2c6db1f"
slug = "scene"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.scene"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
